<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard">
    <div class="sidebar">
      <h2>TaskFlow</h2>
      <a href="#" class="active">Dashboard</a>
      <a href="#">My Tasks</a>
      <a href="#">Completed</a>
      <a href="#">Settings</a>
      <a href="login.html" class="logout">Logout</a>
    </div>
    <div class="main">
      <h1>Welcome back! 👋</h1>
      <p class="subtitle">Let's get things done.</p>
      <div class="cards">
        <div class="card">
          <p>Total Tasks</p>
          <h2>12</h2>
        </div>
        <div class="card">
          <p>Completed</p>
          <h2>8</h2>
        </div>
        <div class="card">
          <p>Pending</p>
          <h2>4</h2>
        </div>
      </div>
      <div class="tasks">
        <h2>Today's Tasks</h2>
        <p>☐ Study HTML and CSS</p>
        <p>☐ Work on my project</p>
        <p>☑ Revise previous work</p>
        <button>+ Add New Task</button>
      </div>
    </div>
  </div>
</body>
</html>
